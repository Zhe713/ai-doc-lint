server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # W8 安全响应头：防点击劫持 / MIME 嗅探 / 内嵌 / 数据外泄
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API 反向代理
    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend-api:8000/health;
    }

    location /docs {
        proxy_pass http://backend-api:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://backend-api:8000/openapi.json;
    }

    # WebSocket（W2 任务进度推送）：单独 location 走 Upgrade 头
    location /api/v1/ws {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 入口页必须每次回源校验：index.html 里引用的是带 hash 的 assets 文件名，
    # 一旦浏览器启发式缓存了旧 index.html，重新构建后旧 hash 会 404，整页白屏。
    # 用 expires -1（Cache-Control: no-cache）而非 add_header，避免覆盖 server 级安全响应头。
    location = /index.html {
        expires -1;
    }

    # 带 hash 的构建产物可长期缓存：内容变则文件名变，天然失效
    location /assets/ {
        expires 1y;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
