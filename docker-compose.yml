# ai-doc-lint 本地/自托管编排（7 容器，名字按"干什么"命名，新手也能看懂）
#
# 每个容器的作用（按启动顺序）：
#   postgres-database  PostgreSQL 18 + pgvector，存文档切片向量、任务状态、LLM 审计日志
#   valkey-cache       Valkey 9（Redis 协议兼容）：Celery 任务队列 + 缓存 + 限流计数
#   minio-storage      MinIO（S3 兼容对象存储）：存原始合同文件和导出的 Word 批注
#   backend-api        FastAPI 后端主服务：接收上传、编排 RAG、调 LLM、出报告
#   celery-worker      Celery worker：后台异步跑大文件解析、校验、批注导出
#   celery-scheduler   Celery beat：定时任务（卡死巡检、自学习闭环）
#   web-frontend       前端网页（nginx 托管 React 构建产物，对外 8080 端口）
name: ai-doc-lint

services:
  postgres-database:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoc_local_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-ai_doc_lint}
      # PostgreSQL 18 镜像要求挂载点在 /var/lib/postgresql，数据放版本子目录
      PGDATA: /var/lib/postgresql/pg18
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidoc} -d ${POSTGRES_DB:-ai_doc_lint}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - aidocnet

  valkey-cache:
    image: valkey/valkey:9.0
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - aidocnet

  minio-storage:
    # Docker Hub 的 minio/minio 在部分网络下会被 registry 拒绝，默认走 Quay 官方镜像
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aidoc_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aidoc_minio_local_pwd}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - aidocnet

  backend-api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器以 appuser(10001) 运行，模型缓存不能落在 /root（权限 700）；
      # 统一迁到 appuser 家目录，modelcache 卷内容（bge-small-zh-v1.5）直接可见
      - HOME=/home/appuser
      - MODEL_CACHE_DIR=/home/appuser/.cache
    depends_on:
      postgres-database:
        condition: service_healthy
      valkey-cache:
        condition: service_healthy
      minio-storage:
        condition: service_healthy
    volumes:
      - modelcache:/home/appuser/.cache
      - modelcache:/home/appuser/.pycorrector
      # 规则目录以宿主持久化（typo 自动白名单可回滚、可编辑）
      - ./backend/app/checkers/rules:/app/app/checkers/rules
      # golden 集只读挂载（自学习闭环回归验证 + 集版本化）
      - ./corpus/acceptance_golden:/app/corpus/acceptance_golden:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - aidocnet

  celery-worker:
    # Celery 解析 worker：复用 backend-api 镜像，改启动命令为 celery worker
    build:
      context: ./backend
    image: ai-doc-lint-backend-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOME=/home/appuser
      - MODEL_CACHE_DIR=/home/appuser/.cache
    entrypoint: ["celery"]
    command:
      - "-A"
      - "app.tasks.celery_app:celery_app"
      - "worker"
      - "-Q"
      - "parse,review,annotate,learn,cross_compare,embed"
      - "--concurrency"
      - "${PARSE_CONCURRENCY:-2}"
      - "--pool"
      - "prefork"
      - "-n"
      - "parse@%h"
      - "--loglevel"
      - "INFO"
    depends_on:
      postgres-database:
        condition: service_healthy
      valkey-cache:
        condition: service_healthy
      minio-storage:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    volumes:
      - modelcache:/home/appuser/.cache
      - modelcache:/home/appuser/.pycorrector
      - ./backend/app/checkers/rules:/app/app/checkers/rules
      - ./corpus/acceptance_golden:/app/corpus/acceptance_golden:ro
    networks:
      - aidocnet

  celery-scheduler:
    # 周期任务：卡死巡检/对账（W7 起挂学习闭环）
    build:
      context: ./backend
    image: ai-doc-lint-backend-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOME=/home/appuser
      - MODEL_CACHE_DIR=/home/appuser/.cache
    entrypoint: ["celery"]
    command:
      - "-A"
      - "app.tasks.celery_app:celery_app"
      - "beat"
      - "--loglevel"
      - "INFO"
    depends_on:
      postgres-database:
        condition: service_healthy
      valkey-cache:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    volumes:
      - ./backend/app/checkers/rules:/app/app/checkers/rules
      - ./corpus/acceptance_golden:/app/corpus/acceptance_golden:ro
    networks:
      - aidocnet

  web-frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - aidocnet

volumes:
  pgdata:
  valkeydata:
  miniodata:
  modelcache:

networks:
  aidocnet:
    driver: bridge
