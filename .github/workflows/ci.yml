name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 后端全量测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 .env（CI 使用示例配置）
        run: cp .env.example .env
      - name: 构建并启动测试栈（db/cache/storage/api）
        run: docker compose up -d --build --wait api
      - name: 容器内运行全量 pytest（含覆盖率门禁 ≥70%）
        run: docker compose exec -T api pytest -q --cov=app --cov-report=term --cov-fail-under=70

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建（含 vue-tsc 类型检查）
        working-directory: frontend
        run: npm run build
