name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  backend-test:
    name: 后端全量测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 .env（CI 使用示例配置）
        run: cp .env.example .env
      - name: 登录 GHCR（拉取自维护的 MinIO 镜像）
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: 预拉取基础镜像（registry 匿名限流时退避重试）
        run: |
          for img in pgvector/pgvector:pg18 valkey/valkey:9.0 ghcr.io/zhe713/ai-doc-lint-minio:latest; do
            ok=0
            for i in 1 2 3 4 5; do
              if docker pull "$img"; then ok=1; break; fi
              echo "pull $img 失败（第 $i 次），10 秒后重试"
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::拉取 $img 连续 5 次失败"; exit 1; }
          done
      - name: 构建并启动测试栈（db/cache/storage/api）
        run: docker compose up -d --build --wait backend-api
      - name: 容器内运行全量 pytest（含覆盖率门禁 ≥70%）
        run: docker compose exec -T backend-api pytest -q --cov=app --cov-report=term --cov-fail-under=70

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建（含 vue-tsc 类型检查）
        working-directory: frontend
        run: npm run build
